name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier format check
        run: npm run format:check

  lint-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: 'file:./test.db'
      SESSION_SECRET: 'ci_test_session_secret_at_least_32_characters_long_12345'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Initialize SQLite test schema
        run: npx prisma db push --skip-generate

      - name: Run Unit & Integration Tests with Coverage
        run: npm run test:coverage

  e2e-test:
    name: End-to-End Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [test]
    env:
      DATABASE_URL: 'file:./test.db'
      SESSION_SECRET: 'ci_test_session_secret_at_least_32_characters_long_12345'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Initialize SQLite test schema
        run: npx prisma db push --skip-generate

      - name: Run Playwright E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright Test Results on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [format-check, lint-check, test, e2e-test]
    env:
      DATABASE_URL: 'file:./dev.db'
      SESSION_SECRET: 'ci_test_session_secret_at_least_32_characters_long_12345'
      NEXT_PUBLIC_APP_URL: 'https://chakribakri.app'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Initialize SQLite schema
        run: npx prisma db push --skip-generate

      - name: Build Next.js application
        run: npm run build
